$kind: http-request
order: 29000
method: POST
url: '{{supabaseUrl}}/rest/v1/rpc/set_order_status'
headers:
  - key: apikey
    value: '{{publishableKey}}'
  - key: Authorization
    value: 'Bearer {{customerToken}}'
body:
  type: json
  content: |-
    {"p_order_id":"{{onlineOrderId}}","p_status":"cancelled","p_reason":null}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Completed sandbox test order cancelled", () => pm.expect(pm.response.json().status).to.eql("cancelled"));
