$kind: http-request
order: 27000
method: GET
url: '{{supabaseUrl}}/rest/v1/orders?select=id,payment_status,total_kwd,paid_at&id=eq.{{onlineOrderId}}'
headers:
  - key: apikey
    value: '{{publishableKey}}'
  - key: Authorization
    value: 'Bearer {{customerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Paid status and timestamp persisted", () => { const o=pm.response.json()[0]; pm.expect(o.payment_status).to.eql("paid"); pm.expect(o.paid_at).to.be.a("string").and.not.empty; });
