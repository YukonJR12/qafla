$kind: http-request
order: 28000
method: GET
url: '{{supabaseUrl}}/rest/v1/order_payments?select=status,currency,amount_kwd&order_id=eq.{{onlineOrderId}}'
headers:
  - key: apikey
    value: '{{publishableKey}}'
  - key: Authorization
    value: 'Bearer {{customerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Exactly one invoice is paid", () => { const paid=pm.response.json().filter(p=>p.status==="paid"); pm.expect(paid).to.have.length(1); pm.expect(paid[0].currency).to.eql("KWD"); });
