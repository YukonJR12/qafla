$kind: http-request
order: 30000
method: GET
url: '{{supabaseUrl}}/rest/v1/orders?select=status,payment_status&id=eq.{{onlineOrderId}}'
headers:
  - key: apikey
    value: '{{publishableKey}}'
  - key: Authorization
    value: 'Bearer {{customerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Cancelling a paid order records refund due", () => { const o=pm.response.json()[0]; pm.expect(o.status).to.eql("cancelled"); pm.expect(o.payment_status).to.eql("refund_due"); });
