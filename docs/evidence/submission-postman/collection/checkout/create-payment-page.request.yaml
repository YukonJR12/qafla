$kind: http-request
order: 13000
method: POST
url: '{{baseUrl}}/api/payments/start'
headers:
  - key: Authorization
    value: 'Bearer {{customerToken}}'
body:
  type: json
  content: |-
    {"orderId":"{{onlineOrderId}}","language":"en","amount":0.001}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Sandbox payment page created", () => { const r=pm.response.json(); pm.expect(r.paymentUrl).to.match(/^https:\/\/[^/]*(myfatoorah\.com|myfatoorah\.com\.kw)\//i); pm.variables.set("paymentUrl",r.paymentUrl); });
