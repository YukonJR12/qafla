$kind: http-request
order: 2000
method: POST
url: '{{supabaseUrl}}/auth/v1/token?grant_type=password'
headers:
  - key: apikey
    value: '{{publishableKey}}'
body:
  type: json
  content: |-
    {"email":"{{vendorEmail}}","password":"{{vendorPassword}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("vendor session issued", () => { const r=pm.response.json(); pm.expect(r.access_token).to.be.a("string").and.not.empty; pm.variables.set("vendorToken",r.access_token); pm.variables.set("vendorId",r.user.id); });
