$kind: http-request
order: 3000
method: GET
url: '{{supabaseUrl}}/rest/v1/profiles?select=role&id=eq.{{customerId}}'
headers:
  - key: apikey
    value: '{{publishableKey}}'
  - key: Authorization
    value: 'Bearer {{customerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Customer role comes from database", () => pm.expect(pm.response.json()[0].role).to.eql("customer"));
